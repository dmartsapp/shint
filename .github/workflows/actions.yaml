name: Build go binary and release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  lint-and-vuln-check:
    name: Lint and Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      actions: read
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        id: sonarqube-scan-check
        uses: sonarsource/sonarcloud-github-action@v5
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.CICD_SONAR_TOKEN }}
          SONAR_PROJECT_KEY: farhansabbir_cicd
          SONAR_ORGANIZATION: farhansabbir
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Summarize SonarQube job
        if: always()
        run: |
          echo "## 🧪 SonarQube Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkout | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| SonarQube Scan | $([[ '${{ steps.sonarqube-scan-check.outcome }}' == 'success' ]] && echo ✅ Success || echo ❌ Failed) |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate | N/A (step is commented out) |" >> $GITHUB_STEP_SUMMARY
      
      - name: Clean up Sonar lock file
        run: |
          if [ -d ".scannerwork" ]; then
            rm -rf .scannerwork
          fi
        shell: bash
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download Go modules
        run: go mod tidy

      - name: Run linting
        id: golangci-lint
        uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          level: info

      - name: Run vulnerability check
        id: govulncheck
        if: ${{ steps.golangci-lint.outcome == 'success' }}
        uses: golang/govulncheck-action@v1
        with:
          output-file: govulncheck-report.txt

      - name: Generate govulncheck summary
        if: always()
        run: |
            echo "## Vulnerability Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| **Status** | **Vulnerabilities Found** |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.govulncheck.conclusion }}" == "success" ]; then
                VULN_COUNT=$(grep 'Vulnerabilities found:' $GITHUB_WORKSPACE/govulncheck-report.txt | awk -F': ' '{print $2}')
                if [ "$VULN_COUNT" -gt 0 ]; then
                    echo "| ❌ Failure | ${VULN_COUNT} |" >> $GITHUB_STEP_SUMMARY
                else
                    echo "| ✅ Success | 0 |" >> $GITHUB_STEP_SUMMARY
                fi
            else
                echo "| ❌ Failure | Unknown (step failed) |" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Details" >> $GITHUB_STEP_SUMMARY
            echo "Checked modules: $(grep 'Checked modules:' $GITHUB_WORKSPACE/govulncheck-report.txt | awk -F': ' '{print $2}')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep -A 1000 'Details:' $GITHUB_WORKSPACE/govulncheck-report.txt >> $GITHUB_STEP_SUMMARY || true

  report-failure:
    name: Report Failure as Issue
    runs-on: ubuntu-latest
    needs: lint-and-vuln-check
    if: failure()
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      
      - name: Create issue on linting/vuln check failure
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "CI Failure: Linting or Vulnerability Check Failed"
          content-filepath: .github/ISSUE_TEMPLATE/ci_failure.md
          labels: bug, ci-failure
          assignees: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: lint-and-vuln-check
    permissions:
      contents: write
      id-token: write
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux, windows, freebsd, openbsd, netbsd, solaris, android]
        arch: [amd64, arm64]
        exclude:
          # Go's solaris port only targets amd64.
          - os: solaris
            arch: arm64
          # android/amd64 needs cgo (external linking) for its libc syscall
          # shims; android/arm64 (real devices, Termux, etc.) builds fine
          # with CGO_ENABLED=0, which is what keeps every other binary here
          # small and statically linked.
          - os: android
            arch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build binary for ${{ matrix.os }}/${{ matrix.arch }}
        id: build-step
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          DT=($(date +%Y-%m-%dT%H:%M:%S%z))
          go build -buildvcs=true -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}/${{ github.sha }}/$DT" -o bin/shint.${{ matrix.os }}.${{ matrix.arch }}${{ (matrix.os == 'windows' && '.exe') || '' }}

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: binary-for-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: lint-and-vuln-check
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU (for cross-arch image builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.ref_name for a "v3.0.0" tag push is "v3.0.0"; derive the
      # bare "3.0.0"/"3.0"/"3" rollup tags from it alongside the full
      # version and :latest, the same convention most container images use.
      - name: Compute image tags
        id: image-tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${MAJOR_MINOR%.*}"
          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$IMAGE:${GITHUB_REF_NAME}"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$MAJOR_MINOR"
            echo "$IMAGE:$MAJOR"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.image-tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      packages: write
      actions: read
    steps:
      - name: Checkout code for commit message
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          
      - name: Generate release notes
        run: |
          echo "## Release Notes for ${{ github.ref_name }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Commit Message" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`code" >> release_notes.md
          echo "${{ github.event.head_commit.message }}" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          
          echo "### Build Status Summary" >> release_notes.md
          echo "| OS/Arch | Status |" >> release_notes.md
          echo "|---|---|" >> release_notes.md
          
          for combo in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64 freebsd-amd64 freebsd-arm64 openbsd-amd64 openbsd-arm64 netbsd-amd64 netbsd-arm64 solaris-amd64 android-arm64; do
            os=$(echo $combo | awk -F'-' '{print $1}')
            arch=$(echo $combo | awk -F'-' '{print $2}')
            binary_name="shint.$os.$arch"
            if [ "$os" == "windows" ]; then
              binary_name+=".exe"
            fi
            
            if [ -f "release-artifacts/binary-for-$os-$arch/$binary_name" ]; then
              echo "| $os/$arch | ✅ Success |" >> release_notes.md
            else
              echo "| $os/$arch | ❌ Failed |" >> release_notes.md
            fi
          done
          
          echo "" >> release_notes.md
          echo "### Code Changes" >> release_notes.md
          echo "\`\`\`diff" >> release_notes.md
          
          # Use a more robust command to find the previous tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | head -n 2 | tail -n 1)
          
          # Use the previous tag and the current tag for the diff
          if [ -n "$PREVIOUS_TAG" ]; then
            git diff $PREVIOUS_TAG..${{ github.ref_name }} >> release_notes.md
          else
            echo "No previous tag found. Showing diff from initial commit." >> release_notes.md
            # This is the SHA of Git's initial empty tree.
            git diff 4b825dc642cb6eb9a060e54bf8d69288fbee4904 ${{ github.ref_name }} >> release_notes.md
          fi
          
          echo "\`\`\`" >> release_notes.md
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}

      - name: List release artifacts
        run: |
          ls -lhR 

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          # Corrected files pattern to match the actual downloaded directory structure
          files: |
            release-artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}