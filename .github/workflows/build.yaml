name: Binary Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Refuses anything that is not a vX.Y.Z tag on a commit that is on main; every
  # other job in this workflow waits for it.
  verify-tag:
    name: Verify release tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yaml

  # A quiet, non-reporting gate: the standalone Lint and Vulnerability Check
  # workflows are what surface failures (their own badges, their own
  # "file an issue" step) - this just makes sure this workflow doesn't ship
  # binaries or a release if either would fail, without duplicating that
  # reporting a second time.
  gate:
    name: Lint & vulnerability gate
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: govulncheck
        uses: golang/govulncheck-action@v1

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      # Only for the attestation step below: a short-lived OIDC token to get a
      # Sigstore signing certificate, and permission to store the attestation.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux, windows, freebsd, openbsd, netbsd, solaris, android]
        arch: [amd64, arm64]
        exclude:
          # Go's solaris port only targets amd64.
          - os: solaris
            arch: arm64
          # android/amd64 needs cgo (external linking) for its libc syscall
          # shims; android/arm64 (real devices, Termux, etc.) builds fine
          # with CGO_ENABLED=0, which is what keeps every other binary here
          # small and statically linked.
          - os: android
            arch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build binary for ${{ matrix.os }}/${{ matrix.arch }}
        id: build-step
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          DT=($(date +%Y-%m-%dT%H:%M:%S%z))
          go build -buildvcs=true -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}/${{ github.sha }}/$DT" -o bin/shint.${{ matrix.os }}.${{ matrix.arch }}${{ (matrix.os == 'windows' && '.exe') || '' }}

      # A signed statement that this exact file was built by this workflow from
      # this commit (SLSA build provenance, keyless via Sigstore). Users check it
      # with: gh attestation verify <file> --repo dmartsapp/shint
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: bin/shint.*

      # bin/ holds only the binary at this point; this adds <binary>.sha256 next
      # to it (see .github/scripts/write-checksums.sh) and checks it.
      - name: Write the SHA-256 checksum
        run: bash .github/scripts/write-checksums.sh bin

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: binary-for-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code for commit message
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate release notes
        env:
          # Passed via env rather than interpolated directly into the script
          # below: a commit message is attacker/author-controlled arbitrary
          # text, and inlining "${{ github.event.head_commit.message }}"
          # straight into a `run:` block turns it into literal shell source
          # - e.g. a message containing `` `some command` `` gets executed
          # by bash as command substitution once it hits `echo "..."`. This
          # is GitHub's own documented script-injection footgun; reading it
          # from an env var here instead keeps it inert, ordinary data.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "## Release Notes for ${{ github.ref_name }}" >> release_notes.md
          echo "" >> release_notes.md
          # What's new is the changelog's section for this tag. The commit message of the
          # tagged commit used to be shown here, which is the wrong text whenever the tag is
          # not on the release commit (a later fix commit was what v4.2.0's page showed). The
          # commit message is only the fallback for a tag with no changelog section.
          SECTION="$(bash .github/scripts/changelog-section.sh "${{ github.ref_name }}" || true)"
          if [ -n "$SECTION" ]; then
            echo "### What's new" >> release_notes.md
            echo "" >> release_notes.md
            printf '%s\n' "$SECTION" >> release_notes.md
          else
            echo "### Commit Message" >> release_notes.md
            echo "" >> release_notes.md
            echo "\`\`\`code" >> release_notes.md
            echo "$COMMIT_MSG" >> release_notes.md
            echo "\`\`\`" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md

          echo "### Build Status Summary" >> release_notes.md
          echo "| OS/Arch | Status |" >> release_notes.md
          echo "|---|---|" >> release_notes.md

          for combo in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64 freebsd-amd64 freebsd-arm64 openbsd-amd64 openbsd-arm64 netbsd-amd64 netbsd-arm64 solaris-amd64 android-arm64; do
            os=$(echo $combo | awk -F'-' '{print $1}')
            arch=$(echo $combo | awk -F'-' '{print $2}')
            binary_name="shint.$os.$arch"
            if [ "$os" == "windows" ]; then
              binary_name+=".exe"
            fi

            if [ -f "release-artifacts/binary-for-$os-$arch/$binary_name" ]; then
              echo "| $os/$arch | ✅ Success |" >> release_notes.md
            else
              echo "| $os/$arch | ❌ Failed |" >> release_notes.md
            fi
          done

          echo "" >> release_notes.md
          echo "### Verify your download" >> release_notes.md
          echo "" >> release_notes.md
          echo "Every binary has a \`.sha256\` file next to it and a signed build attestation." >> release_notes.md
          echo "" >> release_notes.md
          echo "- Checksum: \`sha256sum -c shint.linux.amd64.sha256\` (Linux) or \`shasum -a 256 -c shint.darwin.arm64.sha256\` (macOS), in the folder you downloaded both files to." >> release_notes.md
          echo "- Provenance: \`gh attestation verify shint.linux.amd64 --repo ${{ github.repository }}\` proves the file was built by this repository's workflow from this release's commit." >> release_notes.md

          echo "" >> release_notes.md
          echo "### Code Changes" >> release_notes.md

          # The tag being released won't necessarily sort to the top (e.g. a
          # re-release of an older version), so exclude it explicitly rather
          # than assuming it's first and taking the next entry.
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -vF "${{ github.ref_name }}" | head -n 1)

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Full diff: ${{ github.server_url }}/${{ github.repository }}/compare/$PREVIOUS_TAG...${{ github.ref_name }}" >> release_notes.md
          else
            echo "No previous tag found. Full history: ${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }}" >> release_notes.md
            # This is the SHA of Git's initial empty tree.
            PREVIOUS_TAG=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fi

          echo "" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          # A diffstat summary rather than the full diff: a release spanning
          # many commits can produce a diff well past GitHub's release body
          # size limit (~125,000 characters), which fails release creation
          # outright rather than just looking long.
          git diff --stat "$PREVIOUS_TAG..${{ github.ref_name }}" | tail -c 60000 >> release_notes.md
          echo "\`\`\`" >> release_notes.md
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}

      - name: List release artifacts
        run: |
          ls -lhR

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          # Corrected files pattern to match the actual downloaded directory structure
          files: |
            release-artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
