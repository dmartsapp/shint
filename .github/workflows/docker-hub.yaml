name: Docker Hub Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Refuses anything that is not a vX.Y.Z tag on a commit that is on main; every
  # other job in this workflow waits for it.
  verify-tag:
    name: Verify release tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yaml

  gate:
    name: Lint & vulnerability gate
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # cache: false - golangci-lint-action needs Go on PATH but keeps its own,
      # separate cache (its "golangci-lint.cache-..." key below); the Go module
      # and build cache below is what golang/govulncheck-action@v1 restores a
      # second time internally, and a second restore into the paths this one
      # already populated collided (thousands of `tar: ... Cannot open: File
      # exists` lines, every release - same bug as vulncheck.yaml, found by
      # reading this job's own log on the v4.2.1 tag run). This step still sets
      # up the exact go.mod-pinned Go version for golangci-lint; it just leaves
      # the module/build cache for govulncheck-action's own restore to fill.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: govulncheck
        uses: golang/govulncheck-action@v1

  docker-hub:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU (for cross-arch image builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # github.ref_name for a "v3.0.0" tag push is "v3.0.0"; derive the
      # bare "3.0.0"/"3.0"/"3" rollup tags from it alongside the full
      # version and :latest, the same convention most container images use.
      - name: Compute image tags
        id: image-tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="docker.io/$DOCKERHUB_USERNAME/shint"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${MAJOR_MINOR%.*}"
          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$IMAGE:${GITHUB_REF_NAME}"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$MAJOR_MINOR"
            echo "$IMAGE:$MAJOR"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.image-tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
