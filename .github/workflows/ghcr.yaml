name: GHCR Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Refuses anything that is not a vX.Y.Z tag on a commit that is on main; every
  # other job in this workflow waits for it.
  verify-tag:
    name: Verify release tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yaml

  gate:
    name: Lint & vulnerability gate
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The Go module and build cache is restored here, once, into empty
      # directories, before anything runs - and not again (#75). golangci-lint
      # then downloads whatever the cache lacks, and Go writes module files
      # read-only; golang/govulncheck-action@v1 runs its own actions/setup-go,
      # whose cache restore on top of those files failed on every one of them
      # (about 1590 `tar: ... Cannot open: File exists` lines a run, harmless
      # but a wasted 386 MB). v4.2.2 switched off this restore instead, which
      # left the colliding one; the action's is the one switched off below.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          cache: false   # the cache restored above is the only one (#75)

      # The Dockerfile, through Hadolint (pinned, its download checked in
      # install-tools.sh): an error-level finding stops the release.
      - name: hadolint
        run: |
          bash .github/scripts/install-tools.sh "$RUNNER_TEMP/tools" hadolint
          "$RUNNER_TEMP/tools/hadolint" --failure-threshold error Dockerfile

  ghcr:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      # write: to add the image's SBOMs and reports to the release.
      contents: write
      packages: write
      # Only for the SBOM attestations: a short-lived OIDC token for a Sigstore
      # signing certificate, and permission to store the attestations.
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU (for cross-arch image builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.ref_name for a "v3.0.0" tag push is "v3.0.0"; derive the
      # bare "3.0.0"/"3.0"/"3" rollup tags from it alongside the full
      # version and :latest, the same convention most container images use.
      - name: Compute image tags
        id: image-tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${MAJOR_MINOR%.*}"
          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$IMAGE:${GITHUB_REF_NAME}"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$MAJOR_MINOR"
            echo "$IMAGE:$MAJOR"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Docker's own attestations in the image index, beside each platform's
          # image: an SBOM (made by BuildKit's scanner) and the build's full
          # provenance - what Docker Scout, on Docker Hub, and docker buildx
          # imagetools inspect read.
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.image-tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The image's SBOMs, Grype's vulnerability reports and Dockle's checks,
      # one set per platform, each by its platform's own digest
      # (.github/scripts/image-sboms.py).
      # An image holds the distroless base's Debian packages as well as shint's
      # binary, which is why images get Syft while the release binaries get
      # sbom.py. Syft and Grype are pinned, and their archives checked against
      # SHA-256s pinned in install-tools.sh, before they run. Grype and Dockle
      # report and do not gate: govulncheck gates the release.
      - name: Install Syft, Grype and Dockle
        run: |
          bash .github/scripts/install-tools.sh "$RUNNER_TEMP/tools" syft grype dockle
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: SBOMs and reports of each platform's image
        id: image-sboms
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: python3 .github/scripts/image-sboms.py --image "$IMAGE" --digest "$DIGEST" --name ghcr --out image-sboms

      # Signed statements, like the binaries' (keyless, Sigstore), that each SBOM
      # describes that exact image. Users check them with gh attestation verify
      # oci://<image>@<platform digest> --repo dmartsapp/shint --predicate-type
      # https://cyclonedx.org/bom (or https://spdx.dev/Document/v2.3).
      # They are pushed to the registry too, as referrers of the image.
      - name: Attest the linux/amd64 image's CycloneDX SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image-sboms.outputs.digest_linux_amd64 }}
          sbom-path: image-sboms/image.ghcr.linux.amd64.cdx.json
          push-to-registry: true

      - name: Attest the linux/amd64 image's SPDX SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image-sboms.outputs.digest_linux_amd64 }}
          sbom-path: image-sboms/image.ghcr.linux.amd64.spdx.json
          push-to-registry: true

      - name: Attest the linux/arm64 image's CycloneDX SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image-sboms.outputs.digest_linux_arm64 }}
          sbom-path: image-sboms/image.ghcr.linux.arm64.cdx.json
          push-to-registry: true

      - name: Attest the linux/arm64 image's SPDX SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image-sboms.outputs.digest_linux_arm64 }}
          sbom-path: image-sboms/image.ghcr.linux.arm64.spdx.json
          push-to-registry: true

      # On the tag's release too, beside the binaries, for whoever has a binary
      # and no registry access - once the build workflow has created it.
      - name: Upload the SBOMs and reports to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/upload-release-assets.sh "$GITHUB_REF_NAME" image-sboms/*
