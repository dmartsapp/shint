name: Lint

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Refuses anything that is not a vX.Y.Z tag on a commit that is on main; every
  # other job in this workflow waits for it.
  verify-tag:
    name: Verify release tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yaml

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  report-failure:
    name: Report Failure as Issue
    runs-on: ubuntu-latest
    needs: lint
    # Only when lint itself failed - not when the tag was refused and lint never
    # ran. always() is needed: without a status function GitHub adds an implicit
    # success(), which is false precisely when lint failed. (failure() would also
    # fire for a refused tag, because it looks at every ancestor job.)
    if: always() && needs.lint.result == 'failure'
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts

      # The body is written by a script, from values set here, so it carries the
      # real run URL (an issue template file cannot: GitHub expands ${{ }}
      # only in workflow files).
      - name: Write the issue body
        env:
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          NOTE: "Nothing was published for this tag: the build and image workflows run the same check first and stop if it fails."
        run: bash .github/scripts/write-ci-failure-issue.sh "$RUNNER_TEMP/issue.md"

      - name: Create issue on lint failure
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "CI Failure: Lint"
          content-filepath: ${{ runner.temp }}/issue.md
          labels: bug, ci-failure
          assignees: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
