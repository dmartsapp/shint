name: README Reconcile

# After a release tag, proposes main's README for it: a branch readme/main-vX.Y.Z off
# main with the README reconciled by .github/scripts/readme-reconcile.py (release rows
# and dates from the tags, the summary from the changelog, sprint windows from the
# milestones, new commands from --help, and the tagline, badges, donate button and
# support line every README must have), and a pull request for it - or, when this
# repository does not let Actions open pull requests, an issue that links the branch.
# It never commits to main and never publishes anything: a person reads the diff and the
# warnings and merges (and the Slack message says whether the release itself passed). If
# it fails, the release is unaffected.
#
# It needs only the tag, the changelog and main, so it does not wait for the release
# workflows (a runner that only waits is billed time): it takes under a minute.
# Started by the tag like the release workflows, never by anything else (the trigger
# rule allows nothing else).
#
# The same thing by hand: make readme-reconcile TAG=vX.Y.Z

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: readme-reconcile
  cancel-in-progress: false

jobs:
  readme:
    name: Propose the README for the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push readme/main-vX.Y.Z (never main)
      pull-requests: write   # open the pull request, where the repository allows it
      issues: write          # ... or the issue that links the branch, where it does not
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # every tag and origin/main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Propose the README
        # Everything reaches the script through env, never interpolated into the shell.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PUSH: '1'
          NO_FETCH: '1'      # checkout fetched everything
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/readme-release.sh
