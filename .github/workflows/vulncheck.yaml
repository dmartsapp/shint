name: Vulnerability Check

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Refuses anything that is not a vX.Y.Z tag on a commit that is on main; every
  # other job in this workflow waits for it.
  verify-tag:
    name: Verify release tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yaml

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # No explicit "Set up Go" here: golang/govulncheck-action@v1 runs its own
      # actions/setup-go internally (confirmed in a real run's log - a second,
      # separate setup-go download and cache-restore). Adding another one here
      # used to mean two independent cache restores into the same Go module and
      # build cache paths; the second collided with the first (thousands of
      # `tar: ... Cannot open: File exists` lines) and fell back to "Cache is not
      # found" every time, so every release reinstalled govulncheck from
      # scratch. The scan itself still ran and was still correct - the report
      # file was real - but it never got the caching it was supposed to, and the
      # noise made a passing run look broken. Confirmed against the real log of
      # the v4.2.0 tag's run (35661949691); this fix still needs a real tag
      # push to confirm, since workflows only truly run on tags.

      - name: Run vulnerability check
        id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          output-file: govulncheck-report.txt

      - name: Generate summary
        if: always()
        run: |
          echo "## Vulnerability Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | **Vulnerabilities Found** |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.govulncheck.conclusion }}" == "success" ]; then
              VULN_COUNT=$(grep 'Vulnerabilities found:' $GITHUB_WORKSPACE/govulncheck-report.txt | awk -F': ' '{print $2}')
              if [ "$VULN_COUNT" -gt 0 ]; then
                  echo "| ❌ Failure | ${VULN_COUNT} |" >> $GITHUB_STEP_SUMMARY
              else
                  echo "| ✅ Success | 0 |" >> $GITHUB_STEP_SUMMARY
              fi
          else
              echo "| ❌ Failure | Unknown (step failed) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "Checked modules: $(grep 'Checked modules:' $GITHUB_WORKSPACE/govulncheck-report.txt | awk -F': ' '{print $2}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -A 1000 'Details:' $GITHUB_WORKSPACE/govulncheck-report.txt >> $GITHUB_STEP_SUMMARY || true

  report-failure:
    name: Report Failure as Issue
    runs-on: ubuntu-latest
    needs: govulncheck
    # Only when the check itself failed - not when the tag was refused and it never
    # ran. always() is needed: without a status function GitHub adds an implicit
    # success(), which is false precisely when the check failed. (failure() would
    # also fire for a refused tag, because it looks at every ancestor job.)
    if: always() && needs.govulncheck.result == 'failure'
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts

      # The body is written by a script, from values set here, so it carries the
      # real run URL (an issue template file cannot: GitHub expands ${{ }}
      # only in workflow files).
      - name: Write the issue body
        env:
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          NOTE: "Nothing was published for this tag: the build and image workflows run the same check first and stop if it fails."
        run: bash .github/scripts/write-ci-failure-issue.sh "$RUNNER_TEMP/issue.md"

      - name: Create issue on vulnerability check failure
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "CI Failure: Vulnerability Check"
          content-filepath: ${{ runner.temp }}/issue.md
          labels: bug, ci-failure
          assignees: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
